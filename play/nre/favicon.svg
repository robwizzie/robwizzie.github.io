<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<title>NRE Tracker</title>
<!-- Liquid glass, like the Capacity Scheduler logo: three task cards in function colors, each linked to the next (finish-to-start), ending in a done task. -->
<defs>

<linearGradient id="nr-bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="1" stop-color="#e8ecf3"/>
</linearGradient>
<linearGradient id="nr-rim" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="1"/>
<stop offset=".5" stop-color="#fff" stop-opacity="0"/>
<stop offset="1" stop-color="#fff" stop-opacity=".5"/>
</linearGradient>
<linearGradient id="nr-gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".55"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nr-prim" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".9"/>
<stop offset=".45" stop-color="#fff" stop-opacity=".1"/>
<stop offset="1" stop-color="#fff" stop-opacity=".35"/>
</linearGradient>
<linearGradient id="nr-p0" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7d7bff"/>
<stop offset="1" stop-color="#5856d6"/>
</linearGradient>
<linearGradient id="nr-p1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3cc4dc"/>
<stop offset="1" stop-color="#1a9bb5"/>
</linearGradient>
<linearGradient id="nr-p2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffb340"/>
<stop offset="1" stop-color="#f29400"/>
</linearGradient>
<linearGradient id="nr-line" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3d9bff"/>
<stop offset="1" stop-color="#007aff"/>
</linearGradient>
<radialGradient id="nr-dot" cx=".38" cy=".32" r=".75">
<stop offset="0" stop-color="#7cc0ff"/>
<stop offset=".55" stop-color="#1a86ff"/>
<stop offset="1" stop-color="#0063d6"/>
</radialGradient>
<filter id="nr-sh" x="-30%" y="-40%" width="160%" height="200%">
<feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#1b2540" flood-opacity=".16"/>
</filter>
<clipPath id="nr-clip">
<rect width="512" height="512" rx="114"/>
</clipPath>
<marker id="nr-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#007aff"/></marker>
</defs>
<g clip-path="url(#nr-clip)">
<rect width="512" height="512" fill="url(#nr-bg)"/>
</g>
<rect class="rim" x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="url(#nr-rim)" stroke-width="4"/>
<rect class="rim" x=".75" y=".75" width="510.5" height="510.5" rx="113.25" fill="none" stroke="#0b1530" stroke-opacity=".09" stroke-width="1.5"/>
<path d="M 204 148 H 252 V 188" fill="none" stroke="#007aff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nr-arrow)"/>
<path d="M 308 256 H 356 V 296" fill="none" stroke="#007aff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nr-arrow)"/>
<g filter="url(#nr-sh)">
<rect x="92" y="96" width="112" height="104" rx="30" fill="url(#nr-p0)"/>
<rect x="100" y="101" width="96" height="46" rx="21" fill="url(#nr-gloss)"/>
<rect x="93.5" y="97.5" width="109" height="101" rx="28.5" fill="none" stroke="url(#nr-prim)" stroke-width="3"/>
</g>
<g filter="url(#nr-sh)">
<rect x="196" y="204" width="112" height="104" rx="30" fill="url(#nr-p1)"/>
<rect x="204" y="209" width="96" height="46" rx="21" fill="url(#nr-gloss)"/>
<rect x="197.5" y="205.5" width="109" height="101" rx="28.5" fill="none" stroke="url(#nr-prim)" stroke-width="3"/>
</g>
<g filter="url(#nr-sh)">
<rect x="300" y="312" width="112" height="104" rx="30" fill="url(#nr-p2)"/>
<rect x="308" y="317" width="96" height="46" rx="21" fill="url(#nr-gloss)"/>
<rect x="301.5" y="313.5" width="109" height="101" rx="28.5" fill="none" stroke="url(#nr-prim)" stroke-width="3"/>
</g>
<path d="M 334 365 l 14 14 l 28 -28" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
