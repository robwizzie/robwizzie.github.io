<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<title>Capacity Scheduler</title>
<!-- Liquid glass: program-colored glass jobs on a frosted white tile, and the blue now line. Optically centered (shifted right) to balance the left-aligned jobs. -->
<defs>
<linearGradient id="cs-bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="1" stop-color="#e8ecf3"/>
</linearGradient>
<linearGradient id="cs-rim" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="1"/>
<stop offset=".5" stop-color="#fff" stop-opacity="0"/>
<stop offset="1" stop-color="#fff" stop-opacity=".5"/>
</linearGradient>
<linearGradient id="cs-gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".55"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="cs-prim" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".9"/>
<stop offset=".45" stop-color="#fff" stop-opacity=".1"/>
<stop offset="1" stop-color="#fff" stop-opacity=".35"/>
</linearGradient>
<linearGradient id="cs-p0" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7d7bff"/>
<stop offset="1" stop-color="#5856d6"/>
</linearGradient>
<linearGradient id="cs-p1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3cc4dc"/>
<stop offset="1" stop-color="#1a9bb5"/>
</linearGradient>
<linearGradient id="cs-p2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffb340"/>
<stop offset="1" stop-color="#f29400"/>
</linearGradient>
<linearGradient id="cs-line" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3d9bff"/>
<stop offset="1" stop-color="#007aff"/>
</linearGradient>
<radialGradient id="cs-dot" cx=".38" cy=".32" r=".75">
<stop offset="0" stop-color="#7cc0ff"/>
<stop offset=".55" stop-color="#1a86ff"/>
<stop offset="1" stop-color="#0063d6"/>
</radialGradient>
<filter id="cs-sh" x="-30%" y="-40%" width="160%" height="200%">
<feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#1b2540" flood-opacity=".16"/>
</filter>
<clipPath id="cs-clip">
<rect width="512" height="512" rx="114"/>
</clipPath>
</defs>
<g clip-path="url(#cs-clip)">
<rect width="512" height="512" fill="url(#cs-bg)"/>
</g>
<rect class="rim" x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="url(#cs-rim)" stroke-width="4"/>
<rect class="rim" x=".75" y=".75" width="510.5" height="510.5" rx="113.25" fill="none" stroke="#0b1530" stroke-opacity=".09" stroke-width="1.5"/>
<g transform="translate(12 4)">
<g filter="url(#cs-sh)">
<rect x="92" y="134" width="236" height="70" rx="35" fill="url(#cs-p0)" fill-opacity="1"/>
<rect x="102" y="139" width="216" height="32.2" rx="16.1" fill="url(#cs-gloss)"/>
<rect x="93.5" y="135.5" width="233" height="67" rx="33.5" fill="none" stroke="url(#cs-prim)" stroke-width="3"/>
</g>
<g filter="url(#cs-sh)">
<rect x="190" y="220" width="236" height="70" rx="35" fill="url(#cs-p1)" fill-opacity="1"/>
<rect x="200" y="225" width="216" height="32.2" rx="16.1" fill="url(#cs-gloss)"/>
<rect x="191.5" y="221.5" width="233" height="67" rx="33.5" fill="none" stroke="url(#cs-prim)" stroke-width="3"/>
</g>
<g filter="url(#cs-sh)">
<rect x="92" y="306" width="172" height="70" rx="35" fill="url(#cs-p2)" fill-opacity="1"/>
<rect x="102" y="311" width="152" height="32.2" rx="16.1" fill="url(#cs-gloss)"/>
<rect x="93.5" y="307.5" width="169" height="67" rx="33.5" fill="none" stroke="url(#cs-prim)" stroke-width="3"/>
</g>
<rect x="148" y="104" width="12" height="318" rx="6" fill="url(#cs-line)"/>
<circle cx="154" cy="100" r="20" fill="url(#cs-dot)" filter="url(#cs-sh)"/>
<circle cx="154" cy="100" r="18.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
<ellipse cx="148" cy="92" rx="8" ry="5" fill="#fff" opacity=".55"/>
</g>
</svg>
