<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG video source</title>
<!--
  Source for assets/og-video.mp4 and assets/og-video-poster.png (the link preview).
  Every frame is a pure function of time: render(t) draws the scene at t seconds, so
  tests/build-og-video.js can step through it frame by frame. Open this file in a
  browser to watch it play live. Frame 0 is a complete composition: it doubles as the poster.
  The light blue bar along the bottom is on purpose: iMessage colours the caption bar
  under a preview from the media's bottom edge.
-->
<link href="../assets/fonts.css" rel="stylesheet">
<link href="../vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
<style>
  :root { --bg: #06080d; --text: #eef2fb; --muted: #98a3bd; --blue: #5b8ff9; --blue-hi: #8db2ff; --sky: #a9c6ff; --ink: #0a1430; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(ellipse 55% 70% at 78% 42%, rgba(91,143,249,.15), transparent 70%), var(--bg); }
  #dots { position: absolute; inset: 0; }
  .abs { position: absolute; }

  #brand { left: 64px; top: 46px; display: flex; align-items: center; gap: 12px; }
  #brand img { width: 38px; height: 38px; }
  #brand span { font-family: 'Saira Extra Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: .02em; }

  #kicker { left: 64px; top: 150px; font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--blue-hi); }
  #name { left: 58px; top: 184px; font-family: 'Saira Extra Condensed', sans-serif; font-weight: 800; font-size: 152px; line-height: .86; text-transform: uppercase; }
  #name .outline { color: transparent; -webkit-text-stroke: 2.5px var(--blue); }
  #build { left: 64px; top: 466px; font-size: 32px; font-weight: 600; white-space: nowrap; }
  #typed { color: var(--blue-hi); }
  #caret { display: inline-block; width: 3px; height: 34px; background: var(--blue); margin-left: 4px; vertical-align: -6px; }

  .hex { clip-path: polygon(50% 0, 96% 22%, 96% 78%, 50% 100%, 4% 78%, 4% 22%); }
  #portrait { left: 770px; top: 92px; width: 350px; height: 378px; }
  #portrait .rim { position: absolute; inset: 0; background: var(--blue); }
  #portrait .inner { position: absolute; inset: 0; transform: scale(.955);
    background: #0a0f1c radial-gradient(rgba(91,143,249,.3) 1.4px, transparent 1.5px) 0 0 / 18px 18px; }
  #portrait img { position: absolute; bottom: 0; left: 50%; width: 94%; transform: translateX(-50%); }

  /* The one easter-egg wink: an achievement pop, like the site's */
  #toast { left: 700px; top: 470px; width: 440px; height: 72px; border-radius: 999px; display: flex; align-items: center; gap: 14px;
    padding: 0 26px 0 11px; background: rgba(18,26,44,.94); border: 1px solid #2c3a62; box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 36px rgba(91,143,249,.18); opacity: 0; }
  #toast .ico { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-size: 21px; flex: none; }
  #toast small { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-hi); font-weight: 700; margin-bottom: 2px; }
  #toast strong { display: block; font-size: 19px; font-weight: 700; }
  #toast em { display: block; font-style: normal; font-size: 14px; color: var(--muted); margin-top: 1px; }

  #band { left: 0; right: 0; bottom: 0; height: 56px; background: var(--sky); display: flex; align-items: center; padding: 0 64px;
    color: var(--ink); font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; gap: 12px; }
  #band i { font-size: 17px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="dots" width="1200" height="630"></canvas>

  <div class="abs" id="brand"><img src="../assets/rw-logo.png" alt=""><span>ROB WISCOUNT</span></div>
  <div class="abs" id="kicker">— Front-end &amp; full-stack developer</div>
  <div class="abs" id="name"><div>Rob</div><div class="outline">Wiscount</div></div>
  <div class="abs" id="build">I build <span id="typed"></span><span id="caret"></span></div>

  <div class="abs" id="portrait"><div class="rim hex"></div><div class="inner hex"></div><div class="hex" style="position:absolute;inset:0"><img src="../assets/rob.png" alt=""></div></div>

  <div class="abs" id="toast"><div class="ico"><i class="fas fa-trophy"></i></div><div><small>Achievement unlocked</small><strong>Opened the link</strong><em>16 more secrets hidden on the site</em></div></div>

  <div class="abs" id="band"><i class="fas fa-link"></i> robwiscount.org</div>
</div>

<script>
var DURATION = 10;  // seconds; the loop is seamless at this length
var $ = function (s) { return document.querySelector(s); };
var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
var prog = function (t, a, b) { return clamp((t - a) / (b - a), 0, 1); };
var back = function (x) { var c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// Typing, like the hero: each word is held, deleted, then the next is typed. Starts and ends on the last word.
var WORDS = ['things people use', 'web apps', 'iOS apps', 'video games', 'things people use'];
var HOLD = 1.3, TYPE = 0.075, DEL = 0.035;
var STEPS = [], at = 0;
WORDS.forEach(function (w, i) {
  if (i > 0) { STEPS.push({ word: w, kind: 'type', from: at, to: at + w.length * TYPE }); at += w.length * TYPE; }
  var hold = i === 0 || i === WORDS.length - 1 ? HOLD * 0.9 : HOLD;
  STEPS.push({ word: w, kind: 'hold', from: at, to: at + hold }); at += hold;
  if (i < WORDS.length - 1) { STEPS.push({ word: w, kind: 'del', from: at, to: at + w.length * DEL }); at += w.length * DEL; }
});
var SCALE = DURATION / at;  // stretch the schedule to fill the loop exactly
function typedAt(t) {
  for (var i = 0; i < STEPS.length; i++) {
    var s = STEPS[i], a = s.from * SCALE, b = s.to * SCALE;
    if (t < b || i === STEPS.length - 1) {
      var p = prog(t, a, b), n = s.word.length;
      if (s.kind === 'type') return { text: s.word.slice(0, Math.ceil(p * n)), busy: true };
      if (s.kind === 'del') return { text: s.word.slice(0, n - Math.floor(p * n)), busy: true };
      return { text: s.word, busy: false, since: t - a };
    }
  }
}

var ctx = $('#dots').getContext('2d'), DOTS = [];
for (var y = 17; y < 574; y += 34) for (var x = 17; x < 1200; x += 34) DOTS.push([x, y]);
var OMEGA = 2 * Math.PI * 2 / DURATION;

function render(t) {
  t = ((t % DURATION) + DURATION) % DURATION;

  // The hero's dot grid, with its slow wave looped to DURATION
  ctx.clearRect(0, 0, 1200, 630);
  for (var i = 0; i < DOTS.length; i++) {
    var d = DOTS[i], wave = Math.sin(t * OMEGA + d[0] * 0.012 + d[1] * 0.01) * 0.5 + 0.5;
    ctx.fillStyle = 'rgba(91,143,249,' + (0.06 + wave * 0.1).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(d[0], d[1], 1.25, 0, 6.283); ctx.fill();
  }

  var ty = typedAt(t);
  $('#typed').textContent = ty.text;
  // Caret is solid while typing and blinks while a word is held (on at the start of every hold, so frame 0 shows it)
  $('#caret').style.opacity = ty.busy || Math.floor(ty.since / 0.5) % 2 === 0 ? 1 : 0;

  $('#portrait').style.transform = 'translateY(' + (Math.sin(t / DURATION * 2 * Math.PI) * -7).toFixed(2) + 'px)';

  // One achievement pop mid-loop, gone well before the loop restarts
  var tIn = 4.6, tOut = 7.4, a = prog(t, tIn, tIn + 0.45), z = prog(t, tOut, tOut + 0.35), toast = $('#toast');
  toast.style.opacity = Math.min(a, 1 - z);
  toast.style.transform = 'translateY(' + ((1 - back(a)) * 26 + z * 12).toFixed(2) + 'px) scale(' + (0.94 + 0.06 * back(a)).toFixed(3) + ')';
}

window.render = render;
window.DURATION = DURATION;
window.ready = document.fonts.ready.then(function () {
  return Promise.all(Array.prototype.map.call(document.images, function (img) { return img.decode().catch(function () {}); }));
});
if (!/[?&]capture/.test(location.search)) {
  window.ready.then(function () {
    var start = performance.now();
    (function loop() { render((performance.now() - start) / 1000); requestAnimationFrame(loop); })();
  });
}
</script>
</body>
</html>
